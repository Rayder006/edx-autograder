version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: autograder_db
    restart: always
    environment:
      POSTGRES_DB: autograder
      POSTGRES_USER: autograder_user
      POSTGRES_PASSWORD: autograder_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autograder_user -d autograder"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: autograder_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: autograder
      POSTGRES_USER: autograder_user
      POSTGRES_PASSWORD: autograder_secure_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      AUTOGRADER_ENGINE: pytest
      DJANGO_SECRET_KEY: "change-this-in-production-secret-key"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
